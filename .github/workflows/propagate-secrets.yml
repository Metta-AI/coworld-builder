# Copies the CI credentials every coworld repo needs (SOFTMAX_TOKEN, ANTHROPIC_API_KEY) from
# this repo's secrets onto a target Metta-AI repo. The coordinator dispatches this right after it
# creates `Metta-AI/cogame-<slug>` (prompts/20-build.md) — the sandbox never sees a secret value.
#
#   gh workflow run propagate-secrets.yml -R Metta-AI/coworld-builder -f repo=cogame-<slug>
#
# Secrets on THIS repo: SOFTMAX_TOKEN, ANTHROPIC_API_KEY, GH_PAT. GH_PAT is a user token with
# admin on Metta-AI repos (the fleet convention: the same user-identity token that mounts the
# repos into the agent sandbox). No GitHub App is involved: the org's apps are installed on the
# softmax-agents org, not on Metta-AI, and setting org-level secrets would need admin:org.
name: propagate-secrets

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository name under Metta-AI (e.g. cogame-bullwhip)"
        required: true
        type: string

permissions: {}

concurrency:
  group: propagate-secrets-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          TARGET: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::repo must be a bare repository name under Metta-AI"; exit 1
          fi
      - name: Set the two CI secrets on the target repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET: Metta-AI/${{ inputs.repo }}
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::GH_PAT is empty on coworld-builder"; exit 1; }
          test -n "$SOFTMAX_TOKEN" || { echo "::error::SOFTMAX_TOKEN is empty on coworld-builder"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY is empty on coworld-builder"; exit 1; }
          gh repo view "$TARGET" --json name -q .name >/dev/null
          printf '%s' "$SOFTMAX_TOKEN" | gh secret set SOFTMAX_TOKEN -R "$TARGET"
          printf '%s' "$ANTHROPIC_API_KEY" | gh secret set ANTHROPIC_API_KEY -R "$TARGET"
      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET: Metta-AI/${{ inputs.repo }}
        run: |
          set -euo pipefail
          names=$(gh secret list -R "$TARGET" --json name -q '.[].name' | sort | tr '\n' ' ')
          echo "secrets on $TARGET: $names"
          echo "## propagate-secrets → $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "$names" >> "$GITHUB_STEP_SUMMARY"
          case "$names" in *ANTHROPIC_API_KEY*SOFTMAX_TOKEN*) ;; *) echo "::error::secrets missing after set"; exit 1;; esac
