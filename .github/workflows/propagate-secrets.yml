# Copies the CI credentials every coworld repo needs (SOFTMAX_TOKEN, ANTHROPIC_API_KEY) from
# this repo's secrets onto a target Metta-AI repo, using the softmax-agents GitHub App (which
# has repository `secrets: write` on the org installation). The coordinator dispatches this
# right after it creates `Metta-AI/cogame-<slug>` (prompts/20-build.md) — the sandbox never
# sees a secret value, and no org-admin token is needed anywhere.
#
#   gh workflow run propagate-secrets.yml -R Metta-AI/coworld-builder -f repo=cogame-<slug>
#
# Secrets on THIS repo: SOFTMAX_TOKEN, ANTHROPIC_API_KEY, GH_APP_ID, GH_APP_PRIVATE_KEY.
name: propagate-secrets

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository name under Metta-AI (e.g. cogame-bullwhip)"
        required: true
        type: string

permissions: {}

concurrency:
  group: propagate-secrets-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          TARGET: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::repo must be a bare repository name under Metta-AI"; exit 1
          fi
      - name: Mint an installation token scoped to the target repo
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: Metta-AI
          repositories: ${{ inputs.repo }}
      - name: Set the two CI secrets on the target repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: Metta-AI/${{ inputs.repo }}
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SOFTMAX_TOKEN" || { echo "::error::SOFTMAX_TOKEN is empty on coworld-builder"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY is empty on coworld-builder"; exit 1; }
          printf '%s' "$SOFTMAX_TOKEN" | gh secret set SOFTMAX_TOKEN -R "$TARGET"
          printf '%s' "$ANTHROPIC_API_KEY" | gh secret set ANTHROPIC_API_KEY -R "$TARGET"
          echo "## propagate-secrets" >> "$GITHUB_STEP_SUMMARY"
          gh secret list -R "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: Metta-AI/${{ inputs.repo }}
        run: |
          set -euo pipefail
          names=$(gh secret list -R "$TARGET" --json name -q '.[].name' | sort | tr '\n' ' ')
          echo "secrets on $TARGET: $names"
          case "$names" in *ANTHROPIC_API_KEY*SOFTMAX_TOKEN*) ;; *) echo "::error::secrets missing after set"; exit 1;; esac
