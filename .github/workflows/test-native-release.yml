name: Native release template
on: [pull_request, push]
jobs:
  release-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python tools/tests/test_native_release.py
      - run: bash -n templates/tools/ci/docker_smoke.sh
